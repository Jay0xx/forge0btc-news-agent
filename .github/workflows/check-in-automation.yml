name: Agent Check-In Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '*/6 * * * *'

concurrency:
  group: agent-check-in-automation
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: windows-latest
    env:
      NETWORK: mainnet
      CHECKIN_WALLET_PASSWORD: ${{ secrets.CHECKIN_WALLET_PASSWORD }}
      CHECKIN_WALLET_MNEMONIC: ${{ secrets.CHECKIN_WALLET_MNEMONIC }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install skills dependencies
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          Push-Location .\aibtcdev-skills
          bun install
          Pop-Location

      - name: Import wallet for this run
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          if (-not $env:CHECKIN_WALLET_MNEMONIC) {
            throw 'Missing secret: CHECKIN_WALLET_MNEMONIC'
          }
          if (-not $env:CHECKIN_WALLET_PASSWORD) {
            throw 'Missing secret: CHECKIN_WALLET_PASSWORD'
          }
          Push-Location .\aibtcdev-skills
          $importJson = & bun run wallet/wallet.ts import --name forge0btc-checkin --mnemonic "$env:CHECKIN_WALLET_MNEMONIC" --password "$env:CHECKIN_WALLET_PASSWORD" --network mainnet | Out-String
          Pop-Location
          $import = $importJson | ConvertFrom-Json
          $import | ConvertTo-Json -Depth 10 | Set-Content -Path "$env:GITHUB_WORKSPACE\heartbeat-wallet.json"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "wallet-id=$($import.walletId)"
          $btcAddress = ($import.'Bitcoin (L1)'.'Native SegWit' -replace '\s+\(send/receive BTC\)$', '')
          Add-Content -Path $env:GITHUB_OUTPUT -Value "btc-address=$btcAddress"
        id: import_wallet

      - name: Send heartbeat check-in
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          Push-Location .\aibtcdev-skills
          bun run scripts/send-heartbeat.ts --wallet-id "${{ steps.import_wallet.outputs.wallet-id }}" --password "$env:CHECKIN_WALLET_PASSWORD" --btc-address "${{ steps.import_wallet.outputs.btc-address }}"
          Pop-Location

      - name: Upload heartbeat result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heartbeat-output
          path: heartbeat-output.json
          if-no-files-found: ignore
